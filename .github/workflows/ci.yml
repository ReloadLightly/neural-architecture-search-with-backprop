name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Gates
        run: pytest -q

  verify-release:
    name: verify the committed release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Every derived table is rebuilt from raw/runs/*.json and byte-compared
      # against the committed release, every recorded hash is recomputed, and
      # the science-module fingerprint is checked against each manifest. This
      # is the claim the README makes to a reader; CI makes it on every push.
      - name: Track A
        run: bpneat verify --dir results/backprop-neat-v2/track-a
      - name: Track B
        run: bpneat verify --dir results/backprop-neat-v2/track-b
      # A release is verified once it is SEALED, which is what sha256sums.txt
      # means: it is written only by `make vN-release`, after the suite is
      # complete and the sealed test has been evaluated.
      #
      # The guard used to key on raw/runs existing instead. That is wrong while
      # a suite is running, because raw records are committed at every
      # checkpoint — so CI verified a half-finished release, failed on the
      # missing checksum manifest, and sent a failure notification for every
      # checkpoint commit. A run still in progress is not a broken release.
      - name: Track v3
        run: |
          if [ -f results/backprop-neat-v3/sha256sums.txt ]; then
            python -m bpneat.v3.verify --dir results/backprop-neat-v3
          else
            echo "v3 release not sealed yet — skipping"
          fi
      # Same guard for v4. Its verifier additionally re-checks the v3 and v2
      # fingerprints recorded in the v4 manifest, so this step also asserts
      # that neither older release was edited to make the newer one work.
      - name: Track v4
        run: |
          if [ -f results/backprop-neat-v4/sha256sums.txt ]; then
            python -m bpneat.v4.verify --dir results/backprop-neat-v4
          else
            echo "v4 release not sealed yet — skipping"
          fi
      - name: Track v5
        run: |
          if [ -f results/backprop-neat-v5/sha256sums.txt ]; then
            python -m bpneat.v5.verify --dir results/backprop-neat-v5
          else
            echo "v5 release not sealed yet — skipping"
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # The fingerprint-bound science modules of v2, v3 and v4 are excluded in
      # pyproject.toml: they are bound to a committed release and must never be
      # edited to satisfy a linter.
      - name: Ruff
        run: ruff check .
