[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpneat"
dynamic = ["version"]
description = "Neural networks that evolve their own structure — the calibration experiment for a research line on trusting search to design what cannot be checked by hand"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Roland Löchli" }]
keywords = [
    "neuroevolution",
    "neat",
    "backpropagation",
    "neural-architecture-search",
    "evolutionary-computation",
    "reproducible-research",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/ReloadLightly/backprop-neat-summer"
Release = "https://github.com/ReloadLightly/backprop-neat-summer/tree/main/results/backprop-neat-v2"

[project.scripts]
bpneat = "bpneat.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "bpneat.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
force-exclude = true

# The seven science modules are bound to the release by `code_fingerprint`
# (see `src/bpneat/record.py`). Any edit to them — including a lint fix or a
# format pass — breaks the correspondence between this code and the committed
# results. They are excluded from ruff entirely so that the linter can never
# generate pressure to edit them. `force-exclude` makes the exclusion hold even
# when a file is named explicitly on the command line or by a pre-commit hook.
# `bench/` holds the feasibility probes that sized the compute budget. They are
# historical artifacts, retained exactly as they were run, and are excluded for
# the same reason `run_shard.sh` is left untouched.
extend-exclude = [
    "bench",
    "src/bpneat/baselines.py",
    "src/bpneat/conditions.py",
    "src/bpneat/datasets.py",
    "src/bpneat/evolve.py",
    "src/bpneat/genome.py",
    "src/bpneat/learn.py",
    "src/bpneat/protocol.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B905: `zip(..., strict=)` would change runtime behaviour in the figure code,
# which renders committed evidence. A style rule does not get to alter what the
# release renders.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# `figures.py` imports pyplot only after `matplotlib.use("Agg")`, which the
# module already marks with `noqa: E402`. Import sorting would hoist pyplot
# above that call and break headless rendering, so the block is left alone.
"src/bpneat/figures.py" = ["I001"]
